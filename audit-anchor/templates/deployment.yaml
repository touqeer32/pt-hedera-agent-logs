apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "audit-anchor.fullname" . }}
  labels:
    {{- include "audit-anchor.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "audit-anchor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "audit-anchor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "audit-anchor.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: audit-anchor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "audit-anchor.fullname" . }}-config
            - secretRef:
                name: {{ include "audit-anchor.secretName" . }}
          # livenessProbe:
          #   httpGet:
          #     path: /api/v1/health/live
          #     port: http
          #   initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          #   periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          # readinessProbe:
          #   httpGet:
          #     path: /api/v1/health/ready
          #     port: http
          #   initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          #   periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
