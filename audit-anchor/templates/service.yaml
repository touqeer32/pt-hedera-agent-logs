apiVersion: v1
kind: Service
metadata:
  name: {{ include "audit-anchor.fullname" . }}
  labels:
    {{- include "audit-anchor.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}

spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "audit-anchor.selectorLabels" . | nindent 4 }}
